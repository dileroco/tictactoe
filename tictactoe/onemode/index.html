<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe - One Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-bubbles">
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="game-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <!-- From Uiverse.io by JustCode14 --> 
      <label class="switch">
        <input checked="true" id="checkbox" type="checkbox" />
        <span class="slider">
          <div class="star star_1"></div>
          <div class="star star_2"></div>
          <div class="star star_3"></div>
          <svg viewBox="0 0 16 16" class="cloud_1 cloud">
            <path
              transform="matrix(.77976 0 0 .78395-299.99-418.63)"
              fill="#fff"
              d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
            ></path>
          </svg>
        </span>
      </label>


      <div class="score">You: <span id="scoreX">0</span> - <span id="scoreO">0</span> :Computer</div>
      <div class="top-right">
        <span class="mode">One Player</span>
        <a href="index.html" class="home-btn">🏠</a>
      </div>
    </div>

    <!-- Left Side Panel -->
    <div class="side-panel">
      <div id="player1" class="player active">You (X)</div>
      <div id="player2" class="player">Computer (O)</div>
    </div>

    <!-- Game Board -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2" onclick="add(event)"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
  <dotlottie-player  
    class="celebration" 
    src="https://lottie.host/e95e01c9-3b71-46c0-a4de-f702971b3ddf/iYTyDrgIvp.lottie" 
    background="transparent" 
    speed="1.5" 
    style="display:none; width: 100%; height: 100%; position: absolute; z-index: 2; pointer-events: none;" 
    loop 
    autoplay
  ></dotlottie-player>

  <div class="result-message" id="resultMessage" style="display: none;">
    <div class="result-box">
      <h1 id="resultText">You Win!</h1>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    let regboard = [
      ["", "", ""],
      ["", "", ""],
      ["", "", ""]
    ];

    let win = 0;
    let lose = 0;
    let achive;
    let cur = "X";
    let gameOver = false; // New: To stop playing after game ends

    const cells = document.querySelectorAll(".cell");

    // Remove unused add() function or keep it empty as you had
    const add = (e) => {};

    cells.forEach((cell, index) => {
      cell.addEventListener("click", () => {
        if (cell.innerText === "" && !gameOver && cur === "X") {
          // Player move
          cell.innerText = cur;
          if (index < 3) {
            regboard[0][index] = cur;
          } else if (index < 6) {
            regboard[1][index - 3] = cur;
          } else {
            regboard[2][index - 6] = cur;
          }

          let winner = checkwin();
          if (winner === "X") {
            gameOver = true;
            win++;
            achive = true;
            celebrate();
            return;
          }

          // Computer turn
          oorx();
        }
      });
    });

    const oorx = () => {
      if (cur === "X") {
        cur = "O";

        // Find empty cells
        let emptyCells = [];
        cells.forEach((cell, idx) => {
          if (cell.innerText === "") emptyCells.push(idx);
        });

        if (emptyCells.length === 0) {
          // No moves left — draw or game over
          gameOver = true;
          return;
        }

        // Choose random empty cell for computer
        let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];

        cells[randomIndex].innerText = "O";
        if (randomIndex < 3) {
          regboard[0][randomIndex] = "O";
        } else if (randomIndex < 6) {
          regboard[1][randomIndex - 3] = "O";
        } else {
          regboard[2][randomIndex - 6] = "O";
        }

        // Check if computer won
        let winner = checkwin();
        if (winner === "O") {
          gameOver = true;
          lose++;
          showLose();
          return;
        }

        // Back to player
        cur = "X";
      }
    };

    const celebrate = () => {
      if (achive) {
        const dotlottie = document.querySelector(".celebration");
        dotlottie.style.display = "block";

        const resultM = document.getElementById("resultMessage");
        const resultText = document.getElementById("resultText");

        resultM.style.display = "flex";
        resultText.innerText = "You Win!";

        const resultBox = document.querySelector(".result-box");
        resultBox.classList.remove("lose");
        resultBox.classList.add("win");

        cells.forEach((cell) => {
          if (cell.innerText === "X") cell.style.background = "rgb(239,191,4)";
        });
      }
    };

    const checkwin = () => {
      let winner;

      // Check rows
      for (let j = 0; j < 3; j++) {
        if (
          regboard[j].every((cell) => cell === "O") ||
          regboard[j].every((cell) => cell === "X")
        ) {
          winner = regboard[j][0] === "X" ? "X" : "O";
        }
      }

      // Check columns
      for (let j = 0; j < 3; j++) {
        if (
          (regboard[0][j] === "X" && regboard[1][j] === "X" && regboard[2][j] === "X") ||
          (regboard[0][j] === "O" && regboard[1][j] === "O" && regboard[2][j] === "O")
        ) {
          winner = regboard[0][j] === "X" ? "X" : "O";
        }
      }

      // Check diagonals
      if (
        (regboard[0][0] === "X" && regboard[1][1] === "X" && regboard[2][2] === "X") ||
        (regboard[0][0] === "O" && regboard[1][1] === "O" && regboard[2][2] === "O")
      ) {
        winner = regboard[0][0] === "X" ? "X" : "O";
      }
      if (
        (regboard[0][2] === "X" && regboard[1][1] === "X" && regboard[2][0] === "X") ||
        (regboard[0][2] === "O" && regboard[1][1] === "O" && regboard[2][0] === "O")
      ) {
        winner = regboard[0][2] === "X" ? "X" : "O";
      }

      return winner;
    };

    const showLose = () => {
      const resultM = document.getElementById("resultMessage");
      const resultText = document.getElementById("resultText");
      const dotlottie = document.querySelector(".celebration");

      resultM.style.display = "flex";
      resultText.innerText = "You Lose!";
      const resultBox = document.querySelector(".result-box");
      resultBox.classList.remove("win");
      resultBox.classList.add("lose");
    };

    const resetGame = () => {
      regboard = [
        ["", "", ""],
        ["", "", ""],
        ["", "", ""],
      ];
      cells.forEach((cell) => {
        cell.innerText = "";
        cell.style.background = "var(--primary-color)";
      });
      document.getElementById("resultMessage").style.display = "none";
      document.querySelector(".celebration").style.display = "none";
      cur = "X";
      gameOver = false;
    };




















    const checkbox = document.getElementById('checkbox');

checkbox.addEventListener('change', () => {
  if (checkbox.checked) {
    // Switch ON = light mode
    document.body.classList.remove('dark');
  } else {
    // Switch OFF = dark mode
    document.body.classList.add('dark');
  }
});

    
  </script>
</body>
</html>
