<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-bubbles">
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <div class="game-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <!-- From Uiverse.io by JustCode14 --> 
<label class="switch">
  <input checked="true" id="checkbox" type="checkbox" />
  <span class="slider">
    <div class="star star_1"></div>
    <div class="star star_2"></div>
    <div class="star star_3"></div>
    <svg viewBox="0 0 16 16" class="cloud_1 cloud">
      <path
        transform="matrix(.77976 0 0 .78395-299.99-418.63)"
        fill="#fff"
        d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"
      ></path>
    </svg>
  </span>
</label>

      <div class="score">Player 1: <span id="scoreX">0</span> - <span id="scoreO">0</span> :Player 2</div>
      <div class="top-right">
        <span class="mode">Tow Players mode</span>
        <button class="home-btn">🏠</button>
      </div>
    </div>

    <!-- Left Side Panel -->
    <div class="side-panel">
      <div id="player1" class="player active">Player 1 (X)</div>
      <div id="player2" class="player">Player 2 (O)</div>
    </div>

    <!-- Game Board -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
  </div>
</body>
</html>
